name: weather
version: 1.0.0
type: active
description: 天气查询(Open-Meteo, 免费无 key);active 模式: 恶劣天气提醒
tool:
  function: get_weather
  description: 查询城市当前天气(温度/天气/风力)
  parameters:
    city: {type: string, description: 城市名, 如 北京/上海, 默认北京, required: false}
  timeout_s: 15
permissions: [net:api.open-meteo.com, net:geocoding-api.open-meteo.com]
active:
  every_minutes: 60
  condition: "weather.condition in [rain, snow, thunderstorm]"
