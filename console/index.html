<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="QQ Agent 中央控制台 — 世界心跳 · 记忆 · 对话 · 插件 · TTS 语音管理">
<title>QQ Agent 中央控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2322C55E' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2322C55E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 顶部状态条 -->
<header class="topbar" role="banner">
  <div class="topbar-brand">
    <div class="logo-pulse" aria-hidden="true"><span class="logo-core"></span></div>
    <div class="brand-text">
      <h1>QQ Agent 中央控制台</h1>
      <span class="brand-sub">ME_Agent · v1.0 前端预览</span>
    </div>
  </div>

  <div class="topbar-heartbeat" id="topbarHeartbeat" title="世界心跳：每 5 分钟一拍，纯规则推进">
    <span class="hb-dot" aria-hidden="true"></span>
    <span class="hb-label">世界心跳</span>
    <span class="hb-countdown" id="hbCountdown">--:--</span>
    <span class="hb-tick" id="hbTickCount">tick #0</span>
  </div>

  <div class="topbar-status" role="status" aria-label="服务连接状态">
    <div class="svc" id="svcOnebot"><span class="svc-dot" data-state="ok"></span><span class="svc-name">OneBot</span></div>
    <div class="svc" id="svcConsole"><span class="svc-dot" data-state="ok"></span><span class="svc-name">Console</span></div>
    <div class="svc" id="svcHindsight"><span class="svc-dot" data-state="ok"></span><span class="svc-name">Hindsight</span></div>
    <div class="svc" id="svcMode" title="数据模式：mock 演示 / live 对接后端"><span class="svc-dot" data-state="mock"></span><span class="svc-name" id="modeName">Mock</span></div>
    <time class="topbar-clock" id="topbarClock" datetime="">--:--:--</time>
  </div>
</header>

<div class="layout">

  <!-- 左侧导航 -->
  <nav class="sidebar" aria-label="主导航">
    <ul class="nav-list" id="navList">
      <li>
        <a href="#/overview" data-page="overview">
          <svg viewBox="0 0 24 24" class="nav-ico" aria-hidden="true"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg>
          <span>总览 · 世界心跳</span>
        </a>
      </li>
      <li>
        <a href="#/chat" data-page="chat">
          <svg viewBox="0 0 24 24" class="nav-ico" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>对话流</span>
        </a>
      </li>
      <li>
        <a href="#/plugins" data-page="plugins">
          <svg viewBox="0 0 24 24" class="nav-ico" aria-hidden="true"><path d="M12 2v7M8 5H4a2 2 0 0 0-2 2v13h20V7a2 2 0 0 0-2-2h-4M2 22l4-4M9 13l3 3 3-3"/></svg>
          <span>插件技能</span>
        </a>
      </li>
      <li>
        <a href="#/programs" data-page="programs">
          <svg viewBox="0 0 24 24" class="nav-ico" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M7 9h4M7 12h7"/></svg>
          <span>第三方程序</span>
        </a>
      </li>
      <li>
        <a href="#/tts" data-page="tts">
          <svg viewBox="0 0 24 24" class="nav-ico" aria-hidden="true"><path d="M12 3v10M8 11a4 4 0 0 1 8 0"/><rect x="9" y="16" width="6" height="5" rx="1"/><path d="M12 16v5M5 9a7 7 0 0 1 14 0"/></svg>
          <span>TTS 语音 API</span>
          <span class="nav-badge" id="ttsNavBadge" hidden>!</span>
        </a>
      </li>
      <li class="nav-section-label">系统</li>
      <li>
        <a href="#/settings" data-page="settings">
          <svg viewBox="0 0 24 24" class="nav-ico" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>设置 · API 对接</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-foot">
      <div class="agent-id-card">
        <div class="agent-avatar" aria-hidden="true">满</div>
        <div class="agent-meta">
          <strong id="agentName">小满</strong>
          <span id="agentStateLine">在线 · 心跳运行中</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="main" id="main" tabindex="-1">
    <!-- 各页面由 JS 渲染 -->
  </main>
</div>

<!-- Toast 容器 -->
<div class="toast-stack" id="toastStack" role="region" aria-label="操作提示" aria-live="polite"></div>

<script src="js/utils.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/page-heartbeat.js"></script>
<script src="js/page-chat.js"></script>
<script src="js/page-plugins.js"></script>
<script src="js/page-programs.js"></script>
<script src="js/page-tts.js"></script>
<script src="js/page-settings.js"></script>
<script>App.boot();</script>
</body>
</html>
