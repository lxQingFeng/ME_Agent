# Hindsight 记忆系统 + Obsidian 单向双通道
hindsight:
  base_url: http://127.0.0.1:8888
  api_key_env: HINDSIGHT_API_KEY     # 留空则不带(自托管默认无鉴权)
  endpoints:                          # 对齐官方 HTTP API 1.1(openapi.json 核实 2026-10-25)
    retain: /v1/default/banks/{bank}/memories
    recall: /v1/default/banks/{bank}/memories/recall
    reflect: /v1/default/banks/{bank}/reflect
    banks: /v1/default/banks
    config: /v1/default/banks/{bank}/config
    webhooks: /v1/default/banks/{bank}/webhooks
    health: /health
  banks:
    dialogue: qq-agent     # 群聊记忆库
    knowledge: knowledge   # 知识库(vault 注入)
  defense: true            # Memory Defense(按 bank config 下发: sensitive_data→redact)
  webhook:                 # 生命周期事件回连 ME_Agent(consolidation/retain/defense)
    url: http://host.docker.internal:8000/webhooks/hindsight   # Hindsight 容器→宿主机 ME_Agent
    secret_env: HINDSIGHT_WEBHOOK_SECRET
    event_types: [retain.completed, consolidation.completed, memory_defense.triggered]
recall:
  top_k: 8
  timeout_ms: 800
  token_budget: 600
retain:
  idle_minutes: 8          # 静默 8 分钟触发会话 retain
  heartbeat_batch_minutes: 30
  immediate_importance_min: 2
  daily_budget: 200
reflect:
  cron: "02:00"            # 每日复盘
obsidian:
  vault_dir: vault                  # 仓库内 vault(37 桌面端用 Obsidian 打开同名目录,经网盘/git 同步)
  knowledge_dir: knowledge          # 单向注入源: vault/knowledge/ → knowledge bank
  projection_dir: agent-memory      # fs mount 投影目标: vault/agent-memory/(必须排除在注入源外)
  sync_interval_minutes: 15
  snapshot_cron: "00:10"             # 每日状态快照导出 + git commit(vault 若是 git 仓库)
  mount_command: hindsight fs mount --bank qq-agent vault/agent-memory
