# 周例行锚点(硬/软)+ 兜底时段模板(回退②用)
timezone: Asia/Shanghai
drift_minutes: 20            # 硬锚点允许漂移
week_template:
  weekday:
    anchors:
      - {id: wake,  day: "*",   at: "08:00", activity: wake_routine, hard: true}
      - {id: lunch, day: "*",   at: "12:10", activity: lunch,        hard: true}
      - {id: dinner, day: "*",  at: "18:40", activity: dinner,       hard: true}
      - {id: sleep, day: "*",   at: "00:30", activity: sleep,        hard: true}
      - {id: walk,  day: "*",   at: "19:40", activity: walk,         hard: false, want: 若还有力气就去走走}
      - {id: read,  day: "*",   at: "22:30", activity: reading,      hard: false, want: 睡前看会儿书}
    defaults:  # 兜底时段默认活动(回退②)
      - {from: "00:00", to: "07:55", activity: sleep}
      - {from: "08:00", to: "09:00", activity: light_scroll}
      - {from: "09:00", to: "11:30", activity: coding}
      - {from: "12:10", to: "13:30", activity: lunch}
      - {from: "13:30", to: "18:30", activity: coding}
      - {from: "18:40", to: "19:40", activity: dinner}
      - {from: "19:40", to: "22:30", activity: walk}
      - {from: "22:30", to: "23:59", activity: reading}
  weekend:
    anchors:
      - {id: wake,  day: "*",   at: "09:30", activity: wake_routine, hard: true}
      - {id: lunch, day: "*",   at: "12:30", activity: lunch,        hard: true}
      - {id: dinner, day: "*",  at: "18:40", activity: dinner,       hard: true}
      - {id: sleep, day: "*",   at: "01:30", activity: sleep,        hard: true}
      - {id: run,   day: "*",   at: "17:00", activity: running,      hard: false, want: 傍晚跑个步}
      - {id: game,  day: "*",   at: "20:30", activity: gaming,       hard: false, want: 晚上打两把游戏}
    defaults:
      - {from: "00:00", to: "09:25", activity: sleep}
      - {from: "09:30", to: "12:00", activity: light_scroll}
      - {from: "12:30", to: "14:00", activity: lunch}
      - {from: "14:00", to: "17:00", activity: reading}
      - {from: "17:00", to: "18:30", activity: rest}
      - {from: "18:40", to: "20:30", activity: dinner}
      - {from: "20:30", to: "23:59", activity: gaming}
